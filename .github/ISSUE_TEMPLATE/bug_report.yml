name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security issue? Please report it privately instead — see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce and what you expected instead.
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "panel v0.1.0, OpenVPN 2.7.x, Ubuntu 24.04, Node 24.x"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "`journalctl -u openvpn-panel -n 100` — remove IPs, names and keys first."
      render: text
