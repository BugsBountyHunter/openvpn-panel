name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  shell:
    name: ShellCheck server scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: >-
          shellcheck --severity=warning
          server/install.sh server/uninstall.sh
          server/openvpn-panel-helper server/openvpn-panel-deploy
          scripts/package-release.sh
